<a class="salto-contenido" href="#contenido-principal">Ir a contenido principal</a>

<header class="cabecera">
  <div class="cabecera-marca">
    <span class="cabecera-logo">Ibero Data MX</span>
  </div>
  <div class="cabecera-usuario">
    @if (authService.currentUser(); as user) {
      <span class="avatar">{{ user.fullName.charAt(0) }}</span>
      <span class="cabecera-nombre">{{ user.fullName }}</span>
    }
    <button type="button" class="boton-icono" (click)="logout()" aria-label="Cerrar sesión">
      <app-icon name="log-out" [size]="18" />
    </button>
  </div>
</header>

<div class="shell">
  <aside class="barra-lateral">
    <div class="menu-lateral-busqueda">
      <app-campo-busqueda
        [catalogo]="navItems"
        propiedadBusqueda="label"
        etiqueta='Busca "conjuntos", "análisis"…'
        idCampo="busqueda-lateral"
        (alFiltrar)="alFiltrarMenu($event)"
      />
    </div>

    <nav class="nav-lateral" aria-label="Menú secundario">
      <ul>
        @if (filtrados.length === 0) {
          <li class="menu-lateral-vacio">
            <span>Sin resultados</span>
          </li>
        }
        @for (item of filtrados; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="activo" class="nav-item">
              <app-icon [name]="item.icon" [size]="18" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <main class="contenido" id="contenido-principal">
    <router-outlet />
  </main>
</div>
