<main class="login-pagina">
  <div class="login-tarjeta">
    <div class="login-logo">
      <img
        class="login-logo__img"
        src="/assets/logo-cdmx-2024.svg"
        alt="Ciudad de México. Capital de la Transformación."
        width="140"
        height="32"
      />
    </div>

    <p class="marca">Ibero Data MX</p>
    <h1>Inicia sesión</h1>

    <form (ngSubmit)="submit()" class="grupo-formulario" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" autocomplete="username" />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
      />

      @if (error()) {
        <p class="ayuda-error">{{ error() }}</p>
      }

      <button type="submit" class="boton" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</main>
